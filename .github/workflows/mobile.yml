name: Mobile apps

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.event_name == 'release' && github.event.release.tag_name || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: python3 -m unittest discover -s tests -p test_mobile_release.py -v
      - run: npm run mobile:release
      - name: Verify reproducible archive and complete frontend
        run: node --test tests/test_mobile_build.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: mobile-web-update
          path: web/mobile/
          if-no-files-found: error

  android:
    needs: frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - run: npm run mobile:permissions && npm run mobile:build && npx cap sync android
      - name: Configure optional release signing
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/lingua-release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/lingua-release.jks" >> "$GITHUB_ENV"
          fi
      - name: Build APK and AAB
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bash gradlew assembleDebug assembleRelease bundleRelease
      - name: Stage packages with stable names
        working-directory: android
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Lingua.apk
          cp app/build/outputs/bundle/release/app-release.aab dist/Lingua.aab
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk dist/Lingua-release.apk
          fi
          ls -lh dist
      - uses: actions/upload-artifact@v4
        with:
          name: android-packages
          path: |
            android/dist/Lingua.apk
            android/dist/Lingua-release.apk
            android/dist/Lingua.aab
          if-no-files-found: error
      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/lingua-release.jks"

  ios:
    needs: frontend
    runs-on: macos-15
    timeout-minutes: 45
    env:
      # Secrets are injected here; step "if" expressions cannot reference them.
      IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
      IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
      IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
      IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
      IOS_EXPORT_METHOD: ${{ vars.IOS_EXPORT_METHOD || 'release-testing' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Select Xcode 26
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.0'
      - run: npm ci
      - run: npm run mobile:sync
      - name: Compile for iPhone without signing
        run: >-
          xcodebuild -project ios/App/App.xcodeproj -scheme App
          -configuration Release -destination 'generic/platform=iOS'
          -derivedDataPath ios/App/build CODE_SIGNING_ALLOWED=NO build
      - name: Export signed IPA when credentials are configured
        if: github.event_name != 'pull_request'
        run: |
          if [ -z "$IOS_CERTIFICATE_BASE64" ] || [ -z "$IOS_PROVISION_PROFILE_BASE64" ] || [ -z "$IOS_TEAM_ID" ]; then
            echo "No complete Apple signing secrets; keeping the unsigned IPA."
            exit 0
          fi
          python3 mobile/scripts/ios-release.py
          # Xcode normally names the export App.ipa. Normalize before unsigned fallback.
          find ios/App/build/ipa -maxdepth 1 -name '*.ipa' -exec cp {} "$RUNNER_TEMP/Lingua.ipa" \;
          mv "$RUNNER_TEMP/Lingua.ipa" ios/App/build/ipa/Lingua.ipa
      - name: Package unsigned IPA
        if: hashFiles('ios/App/build/ipa/Lingua.ipa') == ''
        env:
          APP_PATH: ios/App/build/Build/Products/Release-iphoneos/App.app
        run: |
          set -euo pipefail
          rm -rf ios/App/build/ipa mobile-artifacts
          mkdir -p ios/App/build/ipa/Payload mobile-artifacts
          cp -R "$APP_PATH" ios/App/build/ipa/Payload/Lingua.app
          ditto -c -k --sequesterRsrc --keepParent ios/App/build/ipa/Payload ios/App/build/ipa/Lingua.ipa
          cp ios/App/build/ipa/Lingua.ipa mobile-artifacts/Lingua.ipa
          ls -lh mobile-artifacts
      - name: Collect signed IPA
        if: hashFiles('ios/App/build/ipa/Lingua.ipa') != ''
        run: |
          set -euo pipefail
          mkdir -p mobile-artifacts
          cp ios/App/build/ipa/Lingua.ipa mobile-artifacts/Lingua.ipa
          ls -lh mobile-artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: ios-packages
          path: mobile-artifacts/
          if-no-files-found: error

  publish:
    needs: [frontend, android, ios]
    if: >-
      github.event_name != 'pull_request' &&
      (github.event_name != 'release' || !github.event.release.prerelease) &&
      (github.event_name == 'release' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.sha }}
      - uses: actions/download-artifact@v4
        with:
          pattern: '*'
          path: release-assets
          merge-multiple: true
      - name: Replace rolling Pre-release or upload official Release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || '' }}
        run: python3 mobile/scripts/publish-release.py release-assets
