name: Docker

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-test-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    env:
      # Ephemeral test container only; never embedded in the image.
      LINGUA_API_TOKEN: ci-container-smoke-token
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Frontend tests
        run: node --test tests/test_*.mjs

      - uses: docker/setup-buildx-action@v3

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=sha,format=long,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag

      - name: Build local image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: lingua:ci
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Python tests in the offline image
        run: |
          docker run --rm --network none --read-only --tmpfs /tmp:exec,size=128m \
            --mount "type=bind,src=$PWD/tests,dst=/app/tests,readonly" \
            --entrypoint python lingua:ci -m unittest discover -s tests -v

      - name: Start offline container
        run: |
          docker run -d --name lingua-smoke --network none --read-only \
            --tmpfs /tmp:exec,size=128m --cap-drop ALL --security-opt no-new-privileges \
            -e LINGUA_API_TOKEN \
            --mount "type=bind,src=$PWD/docker/smoke_test.py,dst=/checks/smoke_test.py,readonly" \
            lingua:ci

      - name: HTTP smoke tests and health check
        run: |
          docker exec lingua-smoke python /checks/smoke_test.py
          docker exec lingua-smoke python /opt/lingua/healthcheck.py

      - name: Container logs and cleanup
        if: always()
        run: |
          if docker container inspect lingua-smoke >/dev/null 2>&1; then
            docker logs lingua-smoke
            docker rm -f lingua-smoke
          fi

      - name: Log in to GHCR
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the tested image
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            docker tag lingua:ci "$tag"
            docker push "$tag"
          done <<< "$IMAGE_TAGS"
