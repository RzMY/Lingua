<div class="home" id="home">
  <section class="page" id="viewHome" aria-label="首页">
    <div class="hero">
      <div class="hero-acts">
        <button class="hero-a" id="btnSearch" aria-label="搜索" aria-pressed="false">
          <svg class="ic"><use href="#i-search"/></svg></button>
        <button class="hero-add" id="btnAdd" aria-label="导入音频">
          <svg class="ic"><use href="#i-plus"/></svg></button>
      </div>
      <h1 class="wordmark">Lingua</h1>
    </div>
    <div class="finder" id="finder" hidden>
      <svg class="ic ic-sm"><use href="#i-search"/></svg>
      <input id="q" type="text" placeholder="搜索音频…" autocomplete="off" spellcheck="false" aria-label="搜索音频">
      <button class="finder-x" id="btnSearchX" aria-label="清空搜索">
        <svg class="ic ic-sm"><use href="#i-x"/></svg></button>
    </div>
    <div class="list" id="trackList"></div>
    <div class="blank" id="homeBlank" hidden></div>
  </section>

  <section class="page" id="viewSet" hidden aria-label="设置">
    <h1 class="page-t">设置</h1>
    <div class="set" id="setBody"></div>
  </section>

  <nav class="nav" aria-label="主导航">
    <button class="nav-i is-on" data-go="viewHome" aria-current="page">
      <span class="nav-ic"><svg class="ic"><use href="#i-home"/></svg></span><span class="nav-t">首页</span></button>
    <button class="nav-i" data-go="viewSet">
      <span class="nav-ic"><svg class="ic"><use href="#i-gear"/></svg></span><span class="nav-t">设置</span></button>
  </nav>
</div>

<input id="fileAudio" type="file" accept="audio/*,video/*,.wav,.mp3,.m4a,.flac,.ogg,.opus" multiple hidden>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script type="module" src="js/home.js"></script>
</body>
</html>
