<div class="app" id="app">
  <header class="topbar">
    <button class="tb-btn" id="btnBack" aria-label="返回首页"><svg class="ic"><use href="#i-back"/></svg></button>
    <h1 class="tb-title" id="trackTitle">Lingua</h1>
    <button class="tb-btn" id="btnFiles" aria-label="补充文件" title="补充音频与字幕" hidden><svg class="ic"><use href="#i-upload"/></svg></button>
    <button class="tb-btn" id="btnDisplay" aria-label="音频配置" aria-haspopup="dialog"><svg class="ic"><use href="#i-cc"/></svg></button>
  </header>

  <main class="reader" id="scroller" tabindex="-1">
    <div class="reader-vp" id="viewport"></div>
    <div class="reader-state" id="readerState" hidden></div>
    <div class="setup" id="setup" hidden></div>
  </main>

  <section class="panel" id="explainPanel" hidden aria-label="逐词拆解">
    <div class="panel-head">
      <div class="panel-title">逐词拆解<span class="panel-sub" id="explainSub"></span></div>
      <button class="tb-btn tb-btn-sm" id="btnExplainClose" aria-label="关闭拆解"><svg class="ic"><use href="#i-x"/></svg></button>
    </div>
    <div class="panel-body" id="explainBody"></div>
  </section>

  <footer class="player" id="player">
    <div class="p-seek">
      <span class="p-t" id="timeNow">0:00</span>
      <div class="seek" id="seek" role="slider" tabindex="0" aria-label="播放进度"
           aria-valuemin="0" aria-valuemax="0" aria-valuenow="0">
        <div class="seek-hit">
          <div class="seek-rail"><div class="seek-fill" id="seekFill"></div></div>
          <div class="seek-thumb" id="seekThumb"></div>
        </div>
      </div>
      <span class="p-t" id="timeTotal">0:00</span>
    </div>
    <div class="tools">
      <button class="tool" id="btnPin" data-on="1" aria-pressed="true">
        <svg class="ic"><use href="#i-pin"/></svg><span class="tool-t">固定</span></button>
      <button class="tool" id="btnExplain" aria-pressed="false">
        <svg class="ic"><use href="#i-explain"/></svg><span class="tool-t">讲解</span></button>
      <button class="tool" id="btnRepeat" aria-pressed="false">
        <svg class="ic"><use href="#i-repeat"/></svg><span class="tool-t">重复</span></button>
      <button class="tool" id="btnSpeed" aria-haspopup="menu">
        <svg class="ic"><use href="#i-speed"/></svg><span class="tool-t" id="speedText">速度</span></button>
      <button class="tool" id="btnPlay" aria-label="播放">
        <svg class="ic ic-play"><use href="#i-play"/></svg>
        <svg class="ic ic-pause"><use href="#i-pause"/></svg>
        <span class="tool-t" id="playText">播放</span></button>
      <!-- 跟读功能后续单独开发, 暂时隐藏 -->
      <button class="cta" id="btnShadow" hidden aria-pressed="false" aria-label="跟读练习">
        <svg class="ic"><use href="#i-mic"/></svg></button>
    </div>
    <div class="hint" id="hint" hidden></div>
  </footer>
</div>

<audio id="audio" preload="metadata" crossorigin="anonymous"></audio>
<div class="probe" id="probe" aria-hidden="true"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script type="module" src="js/main.js"></script>
</body>
</html>
